<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            background: white;
            width: min(100%, 520px);
            text-align: center;
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 0 14px 40px rgba(23, 42, 80, 0.1);
        }

        .check {
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
        }

        h1 {
            color: #192c59;
            font-size: 30px;
        }

        p {
            color: #62738c;
            line-height: 1.7;
        }

        .event-name {
            color: #192c59;
            font-weight: bold;
        }

        .home-button {
            display: inline-block;
            margin-top: 20px;
            background: #2864ed;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 9px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #194bc4;
        }
    </style>
</head>

<body>

    <main class="success-card">
        <div class="check">&#10003;</div>

        <h1>Registration Successful!</h1>

        <p>
            Thank you,
            <strong th:text="${studentName}">Student</strong>!
        </p>

        <p>
            Your registration for
            <span class="event-name"
                  th:text="${eventName}">Selected Event</span>
            has been saved successfully.
        </p>

        <p>We look forward to seeing you at the event!</p>

        <a class="home-button" th:href="@{/student/dashboard}">
            Back to My Dashboard
        </a>
    </main>

</body>
</html>
