<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Event | CampusConnect</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 550px;
    padding: 35px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(23,42,80,0.08);
}

h2 {
    color: #192c59;
    margin-bottom: 10px;
}

.subtitle {
    color: #62738c;
    margin-bottom: 20px;
}

.error {
    background: #ffe8e8;
    color: #c62828;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
    text-align: center;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: #192c59;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5ddea;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #2864ed;
}

.hint {
    color: #62738c;
    font-size: 13px;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #2864ed;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #194bc4;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2864ed;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

    <h2>📅 Add New Event</h2>

    <p class="subtitle">
        Enter your college event details and publish it for students.
    </p>

    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>

    <form th:action="@{/organizer/add-event}" method="post">

        <label>Event Name</label>
        <input type="text"
               name="eventName"
               placeholder="Enter event name"
               required>

        <label>Event Description</label>
        <textarea name="description"
                  placeholder="Describe your event"
                  required></textarea>

        <label>Event Date</label>
        <input type="date"
               name="eventDate"
               required>

        <label>Registration Closes On (optional)</label>
        <input type="date"
               name="registrationDeadline">
        <p class="hint">
            Last day students can register. Leave empty to allow
            registration until the event date.
        </p>

        <label>Event Venue</label>
        <input type="text"
               name="venue"
               placeholder="Enter event location"
               required>

        <label>Maximum Seats (optional)</label>
        <input type="number"
               name="maxSeats"
               min="1"
               placeholder="Leave empty for no limit">
        <p class="hint">
            When all seats are taken, students cannot register any more.
        </p>

        <button type="submit">Publish Event</button>

    </form>

    <a class="back-link"
       th:href="@{/organizer/dashboard}">
       ← Back to Organizer Dashboard
    </a>

</div>

</body>
</html>
