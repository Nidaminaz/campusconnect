<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Organizer | CampusConnect</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fc;
    color: #1f2937;
    min-height: 100vh;
    padding: 30px 20px;
}

.wrapper {
    max-width: 600px;
    margin: 0 auto;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(23,42,80,0.08);
    margin-bottom: 25px;
}

h2 {
    color: #192c59;
    margin-bottom: 10px;
}

.subtitle {
    color: #62738c;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: #192c59;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5ddea;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #2864ed;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #2864ed;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #194bc4;
}

.error {
    background: #ffe8e8;
    color: #c62828;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
    text-align: center;
}

.success {
    background: #dcfce7;
    color: #15803d;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
    text-align: center;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2864ed;
    text-decoration: none;
}

.organizer-item {
    padding: 12px 0;
    border-bottom: 1px solid #e8edf5;
}

.organizer-item:last-child {
    border-bottom: none;
}

.organizer-item strong {
    color: #192c59;
}

.organizer-item span {
    display: block;
    color: #62738c;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="card">

        <h2>👤 Add New Organizer</h2>

        <p class="subtitle">
            Create an organizer account for a faculty member or club head.
            They can log in on the Organizer Login page and publish events.
        </p>

        <p class="success"
           th:if="${successMessage}"
           th:text="${successMessage}">
        </p>

        <p class="error"
           th:if="${error}"
           th:text="${error}">
        </p>

        <form th:action="@{/organizer/add-organizer}" method="post">

            <label>Full Name</label>
            <input type="text"
                   name="fullName"
                   placeholder="Enter organizer's full name"
                   maxlength="100"
                   required>

            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="Enter organizer's email"
                   maxlength="150"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="At least 8 characters"
                   minlength="8"
                   required>

            <label>Confirm Password</label>
            <input type="password"
                   name="confirmPassword"
                   placeholder="Re-enter the password"
                   minlength="8"
                   required>

            <button type="submit">Create Organizer Account</button>

        </form>

        <a class="back-link" th:href="@{/organizer/dashboard}">
            ← Back to Organizer Dashboard
        </a>

    </div>

    <div class="card">

        <h2>Current Organizers</h2>

        <div class="organizer-item" th:each="o : ${organizers}">
            <strong th:text="${o.fullName}">Name</strong>
            <span th:text="${o.email}">email@example.com</span>
        </div>

    </div>

</div>

</body>
</html>
