<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fc;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 45px;
            background: white;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        h1 {
            color: #163568;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin: 18px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2864ed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #174bc4;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            color: #2864ed;
            text-decoration: none;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Forgot Password?</h1>

    <p>
        Enter your registered email address.
        We will send you a link to reset your password.
    </p>

    <p class="success"
       th:if="${message}"
       th:text="${message}">
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/forgot-password}" method="post">

        <input
            type="email"
            name="email"
            placeholder="Enter your registered email"
            required>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a th:href="@{/student/login}">
        Back to Login
    </a>

</div>

</body>
</html>
