<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fc;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 45px;
            background: white;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        h1 {
            color: #163568;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2864ed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #174bc4;
        }

        .error {
            color: red;
        }

        .success {
            color: #16803c;
        }

        a {
            color: #2864ed;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Reset Password</h1>

    <p>Create a new password for your CampusConnect account.</p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <p class="success"
       th:if="${message}"
       th:text="${message}">
    </p>

    <form th:if="${token != null}"
          th:action="@{/reset-password}"
          method="post">

        <input
            type="hidden"
            name="token"
            th:value="${token}">

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            minlength="8"
            required>

        <input
            type="password"
            name="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required>

        <button type="submit">
            Update Password
        </button>

    </form>

    <br>

    <a th:href="@{/student/login}">
        Back to Login
    </a>

</div>

</body>
</html>
